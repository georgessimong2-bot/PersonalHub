services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: personalhub-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: src/PersonalHub.Api/Dockerfile

    container_name: personalhub-api

    ports:
      - "8080:8080"

    depends_on:
      - sqlserver

    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: PersonalHub
      JwtSettings__Audience: PersonalHubUsers

      OpenAI__ApiKey: ${OPENAI_API_KEY}
  web:
    build:
      context: .
      dockerfile: src/PersonalHub.Web/Dockerfile

    container_name: personalhub-web

    ports:
      - "8081:8081"

    depends_on:
      - api

    environment:
      ASPNETCORE_URLS: "http://+:8081"
      ApiSettings__BaseUrl: "http://api:8080"

volumes:
  sqlserver_data: